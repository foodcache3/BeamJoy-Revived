<!-- a player's actions, shown when their row in the player list is expanded. The staff buttons that
     act on ALL of the player's vehicles at once only show in the full window ($ctrl.full) ; the
     side panel keeps the per-vehicle buttons below -->
<button type="button" class="bjr-btn small" ng-if="$ctrl.crew.canInvite($ctrl.player.playerName)"
    ng-click="$ctrl.inviteToCrew($event)">
    {{'beamjoy.crew.inviteToCrew' | translate}}
</button>
<button type="button" class="bjr-btn small" ng-if="$ctrl.actions.focus !== undefined"
    ng-disabled="!$ctrl.actions.focus" ng-click="$ctrl.action($event,'focus')">
    {{'beamjoy.window.main.playerlist.actions.focus' | translate}}
</button>
<button type="button" class="bjr-btn small" ng-if="$ctrl.actions.teleportTo !== undefined"
    ng-disabled="!$ctrl.actions.teleportTo" ng-click="$ctrl.action($event,'teleportTo')">
    {{'beamjoy.window.main.playerlist.actions.teleportTo' | translate}}
</button>
<button type="button" class="bjr-btn small" ng-if="$ctrl.actions.teleportFrom !== undefined"
    ng-disabled="!$ctrl.actions.teleportFrom" ng-click="$ctrl.action($event,'teleportFrom')">
    {{'beamjoy.window.main.playerlist.actions.teleportFrom' | translate}}
</button>
<button type="button" class="bjr-btn small ghost" ng-if="$ctrl.actions.restore !== undefined"
    ng-disabled="!$ctrl.actions.restore" ng-click="$ctrl.action($event,'restore')">
    {{'beamjoy.window.main.playerlist.actions.restoreAll' | translate}}
</button>
<button type="button" class="bjr-btn small" ng-if="$ctrl.full && $ctrl.actions.freeze !== undefined"
    ng-click="$ctrl.action($event,'freeze')">
    {{($ctrl.player.froze ? 'beamjoy.window.main.playerlist.actions.unfreezeAll' : 'beamjoy.window.main.playerlist.actions.freezeAll') | translate}}
</button>
<button type="button" class="bjr-btn small" ng-if="$ctrl.full && $ctrl.actions.engine !== undefined"
    ng-click="$ctrl.action($event,'engine')">
    {{($ctrl.player.shut ? 'beamjoy.window.main.playerlist.actions.startAll' : 'beamjoy.window.main.playerlist.actions.stopAll') | translate}}
</button>
<button type="button" class="bjr-btn small danger" ng-if="$ctrl.full && $ctrl.actions.delete !== undefined"
    ng-click="$ctrl.action($event,'delete')">
    {{'beamjoy.window.main.playerlist.actions.deleteAll' | translate}}
</button>
