<table>
    <tr>
        <td colspan="2">
            <button
                class="btn info d-flex gap-1 align-center"
                ng-click="$ctrl.openSettings($event)"
            >
                <icon name="open" class="small"></icon>
                <span
                    >{{"beamjoy.window.config.tabs.general.environment.openSettings"|translate}}</span
                >
            </button>
        </td>
    </tr>
    <tr>
        <td class="text-right">
            {{"beamjoy.window.config.tabs.general.environment.timeSync"|translate}}
        </td>
        <td>
            <bj-toggle ng-model="$ctrl.data.timeSync"></bj-toggle>
        </td>
    </tr>
    <tr>
        <td class="text-right">
            {{"beamjoy.window.config.tabs.general.environment.gravitySync"|translate}}
        </td>
        <td>
            <bj-toggle ng-model="$ctrl.data.gravitySync"></bj-toggle>
        </td>
    </tr>
    <tr>
        <td colspan="2">
            <div class="pt-1 d-flex gap-1">
                <button
                    class="btn success w-fitcontent"
                    ng-class="{'disabled': !$ctrl.dirty}"
                    ng-disabled="!$ctrl.dirty"
                    ng-click="$ctrl.save()"
                >
                    {{"beamjoy.common.save"|translate}}
                </button>
                <button
                    class="btn danger w-fitcontent"
                    ng-class="{'disabled': !$ctrl.dirty}"
                    ng-disabled="!$ctrl.dirty"
                    ng-click="$ctrl.cancel()"
                >
                    {{"beamjoy.common.cancel"|translate}}
                </button>
            </div>
        </td>
    </tr>
</table>
