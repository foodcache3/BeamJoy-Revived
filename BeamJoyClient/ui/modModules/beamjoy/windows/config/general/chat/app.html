<!-- ServerNameColor/ServerTextColor/EventColor/BroadcastColor pickers removed from this UI, per
     direct request : native BeamMP chat only supports its own fixed `^`-color-code palette now
     (see chat.js's own rewrite comment: the custom RGB coloring these applied to used a hand-
     built DOM node this rewrite moved away from), so editing them here no longer does anything
     visible. Left in $ctrl.data/save()'s own payload untouched (still round-tripped verbatim,
     same "preserved even though not editable here" treatment Freeroam's own TeleportDelay gets)
     in case native color support returns later: only the UI is hidden, not the data. -->
<table>
    <tr>
        <td class="text-right">
            {{"beamjoy.window.config.tabs.general.chat.ShowStaffTag"|translate}}
        </td>
        <td>
            <div class="d-flex align-center w-fitcontent">
                <bj-toggle ng-model="$ctrl.data.ShowStaffTag"></bj-toggle>
            </div>
        </td>
    </tr>
    <tr>
        <td class="text-right">
            {{"beamjoy.window.config.tabs.general.chat.WelcomeMessage"|translate}}
        </td>
    </tr>
    <tr ng-repeat="el in $ctrl.data.WelcomeMessage">
        <td class="text-right">{{el.lang}}</td>
        <td>
            <input type="text" ng-model="el.message" class="w-100" />
        </td>
    </tr>
    <tr>
        <td colspan="2">
            <div class="d-flex gap-1">
                <button
                    class="btn success w-fitcontent"
                    ng-class="{'disabled': !$ctrl.dirty}"
                    ng-disabled="!$ctrl.dirty"
                    ng-click="$ctrl.save()"
                >
                    {{"beamjoy.common.save"|translate}}
                </button>
                <button
                    class="btn danger w-fitcontent"
                    ng-class="{'disabled': !$ctrl.dirty}"
                    ng-disabled="!$ctrl.dirty"
                    ng-click="$ctrl.cancel()"
                >
                    {{"beamjoy.common.cancel"|translate}}
                </button>
            </div>
        </td>
    </tr>
</table>
