<style>
    /* pins the header + the active section's translate/rotate/snap toolbar above a separately
       scrolling panel, same split hunterArena / infectedArena already use */
    bj-config-freeroam {
        display: block;
        height: 100%;
        overflow: hidden;
    }
    bj-config-freeroam .editor-root {
        height: 100%;
        display: flex;
        flex-direction: column;
    }
    bj-config-freeroam .editor-pinned {
        flex-shrink: 0;
    }
    bj-config-freeroam .section-panel {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
    }
    bj-config-freeroam .section-bar {
        border-bottom: thin solid gray;
    }
    bj-config-freeroam .section-tab {
        padding: 0.3em 0.6em;
        border: thin solid gray;
        border-radius: 0.3em;
        border-bottom-left-radius: unset;
        border-bottom-right-radius: unset;
        background-color: rgba(0, 0, 0, 0.1);
        transition: all 0.2s ease-in-out;
    }
    bj-config-freeroam .section-tab.active {
        background-color: rgba(0, 140, 90, 0.4);
    }
    bj-config-freeroam .section-tab.disabled {
        opacity: 0.4;
        pointer-events: none;
    }
    bj-config-freeroam .section-tab:not(.disabled):hover {
        color: rgb(241 255 164);
    }
</style>

<div class="editor-root">
    <div class="editor-pinned">
        <div class="d-flex gap-1 mb-2 align-center">
            <span class="flex-grow-1 opacity-70 small">
                {{'beamjoy.window.config.tabs.freeroam.hint' | translate}}
            </span>
            <button
                ng-if="$ctrl.dirty"
                class="btn warning"
                ng-click="$ctrl.discard($event)"
                title="{{'beamjoy.common.cancel' | translate}}"
            >
                <icon name="reset"></icon>
            </button>
            <button
                class="btn success"
                ng-click="$ctrl.save($event)"
                ng-disabled="!$ctrl.dirty"
                title="{{'beamjoy.common.save' | translate}}"
            >
                <icon name="save"></icon>
            </button>
        </div>

        <div class="section-bar d-flex flex-wrap">
            <div
                class="section-tab cursor-pointer"
                ng-repeat="section in $ctrl.SECTIONS"
                ng-class="{active: $ctrl.activeSection === section, disabled: $ctrl.dirty && $ctrl.activeSection !== section}"
                ng-click="$ctrl.changeSection($event, section)"
            >
                {{('beamjoy.window.config.tabs.freeroam.sections.' + section) | translate}}
            </div>
        </div>

        <bj-point-list-editor-toolbar
            ng-if="$ctrl.activeSection === 'stations'"
            events="$ctrl.stationsSnapEvents"
        ></bj-point-list-editor-toolbar>
        <bj-point-list-editor-toolbar
            ng-if="$ctrl.activeSection === 'buslines'"
            events="$ctrl.busSnapEvents"
        ></bj-point-list-editor-toolbar>
    </div>

    <div class="section-panel" ng-if="$ctrl.activeSection === 'stations'">
        <bj-config-stations></bj-config-stations>
    </div>

    <div class="section-panel" ng-if="$ctrl.activeSection === 'buslines'">
        <bj-config-bus-lines></bj-config-bus-lines>
    </div>
</div>
