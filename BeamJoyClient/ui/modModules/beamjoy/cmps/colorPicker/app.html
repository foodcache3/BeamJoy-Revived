<style>
    bj-color-picker {
        display: block;
        width: fit-content;
    }

    .color-picker-wrapper {
        background-color: rgba(0, 0, 0, 0.2);
        border-radius: 0.3em;
    }
    .color-picker-wrapper:not(.disabled) {
        cursor: pointer;
    }
    .color-picker-wrapper .color-preview {
        width: 4em;
        height: 1.5em;
    }
    .color-picker-wrapper {
        display: flex;
        align-items: center;
        gap: 0.3em;
    }
    .color-picker-wrapper .clear-btn {
        opacity: 0.6;
    }
    .color-picker-wrapper .clear-btn:hover {
        opacity: 1;
    }
</style>

<div
    class="color-picker-wrapper p-1 w-fitcontent"
    ng-class="{'disabled': $ctrl.disabled === true}"
    ng-click="$ctrl.onToggle()"
>
    <div
        class="color-preview"
        ng-style="{'background-color': $ctrl.ngModel}"
    ></div>
    <!-- Real gap: there was no way to go back to "no color set" (free paint choice for that
         role) once a color had been picked - clearing was only ever possible by editing the raw
         saved data directly. -->
    <button
        class="btn icon clear-btn"
        ng-if="$ctrl.ngModel && $ctrl.disabled !== true"
        ng-click="$ctrl.clear($event)"
        title="{{'beamjoy.cmps.colorPicker.clear' | translate}}"
    >
        <icon name="remove"></icon>
    </button>
</div>
